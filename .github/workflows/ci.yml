# ============================================================================
# 公开 CI 壳仓 (ferrite-ci, PUBLIC)  ——  代理私有 NewXapi/ferrite 的重活 CI
#
# 原理：GitHub 分钟数按「运行 workflow 的仓库」计费。public 仓的标准 runner
# 分钟免费、无上限。所以把「跑测试的 workflow」放公开壳仓，运行时用 PAT 检出
# 私有代码，重活就白跑；私有仓本身几乎不烧分钟。
#
# 触发（二选一，从简单到自动）：
#   1. 手动：Actions → Run workflow → 填 branch/sha。临时方案够用，私有仓 0 成本。
#   2. 自动门禁：私有 ferrite 放一个 ~5 行的 workflow，push/PR 时
#      `gh api -X POST .../dispatches -f event_type=gate -f client_payload[sha]=...`
#      触发本仓，本仓跑完把结果写回私有 commit 的 status（下方 report 步骤），
#      私有仓 branch protection 要求该 context → 公开 CI 真正挡住私有仓合并。
#
# 需要的 secret（都在本 PUBLIC 仓 Settings→Secrets 配）：
#   FERRITE_CI_PAT  fine-grained PAT：
#     - Repository access: NewXapi/ferrite + NewXapi/ui-kit（都勾）
#     - Contents: Read（两个仓）→ 用来 checkout 私有代码
#     - Commit statuses: Write（仅 NewXapi/ferrite）→ 用来回写 CI 结果
#
# 安全护栏（重要，别删）：
#   ▸ 公开仓无法关闭 fork（allow_forking 只有私有 org 仓能设）；真正的控制是
#     「触发器列表」：本仓 on: 只挂 workflow_dispatch + repository_dispatch，
#     没有 pull_request / push / issue 等任何不可信触发器。所以：
#       - fork PR 跑不了本 workflow（无对应触发器）→ 拿不到 FERRITE_CI_PAT；
#       - fork PR 读不到缓存（不运行就无 restore）→ 也投毒不了；
#       - 唯一读得到 cache 的是「可信触发器」的运行，而 cache 只存 ~/.cargo。
#   ▸ cache 只存 ~/.cargo（公共 crate），绝不存 target/（私有 build 产物+源码路径）。
#   ▸ 公开仓的 Actions 日志对所有人可见 → 不要在日志 echo 私有源码/密钥；
#     cargo test 失败会打印源码片段，这是公开壳仓绕不开的泄露面，临时可接受。
#   ▸ 公开仓的 artifacts 任何人可下载 → 不要把私有 build 产物 upload 到本仓。
# ============================================================================
name: CI (private ferrite proxy)

on:
  # 手动触发（临时方案的默认用法）
  workflow_dispatch:
    inputs:
      ref:
        description: '要测的私有仓分支或 SHA'
        required: true
        default: main
      base:
        description: 'diff 基线（ci_scope.py 用；留空=全量）'
        required: false
        default: ''
  # 自动门禁（私有仓 dispatch 触发）
  repository_dispatch:
    types: [gate]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: 检出私有实现仓 ferrite
        uses: actions/checkout@v4
        with:
          repository: NewXapi/ferrite
          ref: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
          token: ${{ secrets.FERRITE_CI_PAT }}
          fetch-depth: 0

      - name: 记 SHA（供回写 status 用）
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 检出私有 sibling 依赖 ui-kit 到 $HOME/ui-kit（path dep 解析位）
        uses: actions/checkout@v4
        with:
          repository: NewXapi/ui-kit
          token: ${{ secrets.FERRITE_CI_PAT }}
          path: .ui-kit
      - name: 放到 path dep 解析位置
        run: |
          set -e
          rm -rf "$HOME/ui-kit"
          cp -r .ui-kit "$HOME/ui-kit"
          rm -rf .ui-kit
          test -f "$HOME/ui-kit/Cargo.toml" && echo "ui-kit -> $HOME/ui-kit"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 装 mold（仓库 .cargo/config.toml 指定 clang + mold，不装会在链接期报错）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

      - name: Cache 依赖（只 ~/.cargo，绝不 target/ —— 见文件头安全护栏）
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          # 关键：Cargo.lock 一变就 miss，但 cargo metadata --no-deps 离线模式要 registry 索引。
          # prefix restore-keys 保证 miss 时仍能恢复上次缓存的 registry/ 索引（等价 rust-cache 的 fallback）。
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # 有 base 就按 diff 动态选包，否则全量（与私有仓 ci.yml 的 dynamic-test 对齐）
      - name: 解析受影响包
        id: scope
        if: inputs.base != '' || github.event.client_payload.base != ''
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          python3 scripts/ci_scope.py --format github \
            --base "origin/${{ inputs.base || github.event.client_payload.base }}" \
            --seed 'db/migrations/**=db-bootstrap' \
            --wasm-dir crates/web --wasm-dir apps/admin-web --wasm-dir apps/tavern-web

      - name: 测试（有 scope 走动态，否则全量）
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.skip }}" = "true" ]; then
            echo "scope=skip（${{ steps.scope.outputs.reason }}）"
          elif [ -n "${{ steps.scope.outputs.test }}" ]; then
            IFS=',' read -ra P <<< "${{ steps.scope.outputs.test }}"
            for p in "${P[@]}"; do echo ">>> cargo test -p $p"; cargo test -p "$p"; done
          else
            cargo test --all
          fi

      - name: wasm 编译（前端包）
        if: steps.scope.outputs.wasm != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra P <<< "${{ steps.scope.outputs.wasm }}"
          ARGS=(); for p in "${P[@]}"; do ARGS+=(-p "$p"); done
          cargo check --target wasm32-unknown-unknown "${ARGS[@]}"

  # 回写结果到私有仓 commit，让私有仓 branch protection 能挡住合并。
  # 独立 job（needs ci）：等 ci 真正结束再报，避免对本 run 的 commit 422。
  report:
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 回写 CI status 到私有仓
        env:
          GH_TOKEN: ${{ secrets.FERRITE_CI_PAT }}
          SHA: ${{ needs.ci.outputs.sha }}
          STATE: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # ci 成功 -> success；失败/跳过 -> failure（跳过通常没跑测试，按失败挡）
          if [ "$STATE" = "success" ]; then s="success"; else s="failure"; fi
          echo "回写 $SHA -> $s"
          for i in 1 2 3; do
            gh api -X POST "repos/NewXapi/ferrite/statuses/$SHA" \
              -f state="$s" \
              -f target_url="$RUN_URL" \
              -f context="ci" \
              -f description="ferrite-ci proxy: $s" \
              && break || sleep 3
          done

